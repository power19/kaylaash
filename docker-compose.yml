version: '3.8'

services:
  kaylaash-app:
    build: .
    container_name: kaylaash-app
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
      AUTH_SECRET: ${AUTH_SECRET:-change-this-secret-in-production-min-32-chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEFAULT_EXCHANGE_RATE: ${DEFAULT_EXCHANGE_RATE:-35.5}
    volumes:
      - kaylaash-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped

  kaylaash-nginx:
    image: nginx:alpine
    container_name: kaylaash-nginx
    ports:
      - "3080:80"
      - "3443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-certs:/etc/nginx/certs:ro
    depends_on:
      - kaylaash-app
    restart: unless-stopped

volumes:
  kaylaash-data:
